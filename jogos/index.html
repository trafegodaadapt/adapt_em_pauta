arams.set('pauta',prompt);location.assign(u.href)}};document.addEventListener('DOMContentLoaded',()=>{(()=>{

 {id:'office',label:'The Office',title:'O escritório teria câmera. Tu teria qual papel?',short:'Quem tu seria em The Office?',intro:'Uma câmera vira na tua direção. O café acabou. Alguém marcou outra reunião. Descobre como tu entraria nesse episódio.',accent:'#fac56b',surface:'#292333',cover:'jim',coverPosition:'50% 28%',stamp:'SCRANTON, FILIAL LAJEADO',profiles:[
 p('jim','Jim Halpert','A câmera nem precisa perguntar.','Tu pega o absurdo da situação antes de todo mundo e costuma encontrar uma saída criativa. Teu humor funciona como uma ponte: aproxima a galera sem precisar de um palco.','Ler o ambiente e improvisar uma boa solução.','Tentar resolver um assunto sério só com aquela olhadinha para a câmera.','O slide trava. Tu quebra o gelo, puxa um plano B e ainda rende o meme que vai circular depois.',['Jogo de cintura','Humor observador']),
 p('pam','Pam Beesly','A ideia boa tava no teu caderno.','Tu nota detalhes que passam batido, escuta de verdade e gosta de dar forma às ideias. Não precisa ocupar a conversa inteira para deixar tua marca nela.','Transformar escuta e imaginação em algo que faz sentido.','Esperar a ideia ficar perfeita para mostrar ao mundo.','A reunião termina e tu manda aquele rascunho que organiza tudo o que ninguém conseguiu explicar.',['Olhar criativo','Escuta atenta']),
 p('dwight','Dwight Schrute','Tu já trouxe o plano. E o plano reserva.','Quando a missão aparece, tu quer entender o terreno e entrar em ação. Preparação, detalhe e vontade de fazer acontecer puxaram teu resultado.','Tirar a ideia do “vamos ver” e fazer a coisa andar.','Criar um protocolo de oito páginas para dividir um bolo.','O evento mudou de sala. Tu já achou a tomada, a extensão e a rota mais curta.',['Iniciativa','Modo missão']),
 p('michael','Michael Scott','A reunião virou um episódio especial.','Tu gosta da energia de juntar pessoas e fazer um momento comum ganhar importância. Tem entusiasmo e vontade de que ninguém fique de fora.','Criar encontros e celebrar o que o grupo construiu.','Preparar uma abertura de premiação para um aviso de dois minutos.','Era só um café. Quando a galera percebe, já tem brinde, discurso e foto da comemoração.',['Entusiasmo','Conexão']),
 p('oscar','Oscar Martinez','Calma. Vamos entender isso direito.','Tu tende a procurar contexto antes de comprar uma ideia. Faz perguntas, compara possibilidades e ajuda a conversa a sair da confusão.','Explicar o complicado sem perder o fio da meada.','Trazer uma planilha para decidir a cobertura da pizza.','Alguém solta um número sem contexto. Tu faz a pergunta que faltava e evita meia hora de discussão.',['Clareza','Olhar analítico']),
 p('stanley','Stanley Hudson','Se podia ser simples, tu percebeu.','Tu valoriza autonomia, foco e um ritmo que faça sentido. Sabe separar o essencial do barulho e não vê problema em curtir uma pausa em paz.','Resolver o principal sem transformar tudo em uma novela.','Encerrar mentalmente a reunião antes do último “só mais uma coisa”.','A conversa se perde. Tu resume a decisão em uma frase e salva o tempo de todo mundo.',['Objetividade','Paz no café'])],questions:[
 q('o1','A call era de 15 minutos. Já foi para 40. Tu…',[
 ['Faço uma observação certeira para destravar a conversa.',0,4,'achar uma saída com humor'],['Desenho um resumo do que ainda está confuso.',1,4,'dar forma ao que estava solto'],['Puxo os próximos passos e quem faz o quê.',2,5,'transformar conversa em ação'],['Tento garantir que a galera ainda esteja participando.',3,1,'trazer as pessoas para a conversa']]),
 q('o2','O grupo quer marcar um rolê. Qual mensagem parece tua?',[
 ['“Quais opções cabem no horário e no orçamento?”',4,2,'buscar contexto antes da decisão'],['“Decidam um lugar. Só me avisem o horário.”',5,0,'simplificar a escolha'],['Mando uma ideia inesperada que resolve o impasse.',0,3,'improvisar uma alternativa'],['Pergunto o que faria todo mundo se sentir à vontade.',1,3,'cuidar de como o grupo se sente']]),
 q('o3','Tu recebe uma tarefa totalmente nova. O primeiro impulso é…',[
 ['Entender as etapas e já começar um teste.',2,4,'se preparar para entrar em ação'],['Chamar alguém e transformar em uma missão em dupla.',3,0,'criar energia junto de alguém'],['Investigar o problema antes de escolher a ferramenta.',4,1,'entender antes de escolher'],['Definir o mínimo necessário e seguir por ali.',5,2,'priorizar o essencial']]),
 q('o4','O jornal te deu uma página. Ela teria…',[
 ['Uma criação ou um talento que pouca gente conhece.',1,0,'abrir espaço para a criatividade'],['Uma curiosidade com uma explicação que vale guardar.',4,2,'trazer uma descoberta com contexto'],['Uma entrevista que juntasse gente de setores diferentes.',3,1,'aproximar pessoas'],['Um desafio com começo, fim e regras bem pensadas.',2,5,'tirar um desafio do papel']]),
 q('o5','Uma pausa perfeita de dez minutos inclui…',[
 ['Café, silêncio e nenhuma notificação nova.',5,1,'respeitar teu ritmo'],['Uma resenha que rende uma boa história.',0,3,'encontrar graça na rotina'],['Resolver aquele pequeno enigma que ficou na cabeça.',2,4,'mergulhar no desafio'],['Ouvir uma música e rabiscar uma ideia.',1,5,'dar espaço à imaginação']]),
 q('o6','Te pediram para fechar a semana em uma frase. Tu prefere…',[

 q('o8','Uma ideia tua foi questionada. Qual reação combina mais?',[

(function(root){
 function score(quiz,answers){const totals=quiz.profiles.map(()=>0),primary=quiz.profiles.map(()=>0);for(const a of answers){const question=quiz.questions.find(q=>q.id===a.q),option=question?.options.find(o=>o.id===a.o);if(!option)throw Error('Resposta inválida');totals[option.primary]+=3;totals[option.secondary]+=1;primary[option.primary]++;}
 const order=totals.map((_,i)=>i).sort((a,b)=>totals[b]-totals[a]||primary[b]-primary[a]||a-b);const tied=order.filter(i=>totals[i]===totals[order[0]]&&primary[i]===primary[order[0]]);let winner=order[0];if(tied.length>1){for(const a of [...answers].reverse()){const o=quiz.questions.find(q=>q.id===a.q).options.find(o=>o.id===a.o);if(tied.includes(o.primary)){winner=o.primary;break;}}}const reasons=answers.map(a=>quiz.questions.find(q=>q.id===a.q).options.find(o=>o.id===a.o)).filter(o=>o.primary===winner||o.secondary===winner).slice(0,2).map(o=>o.reason);return {winner,runner:order.find(i=>i!==winner&&totals[i]>0),totals,reasons,tie:tied.length>1};}
 function shuffle(items,random=Math.random){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
 const api={score,shuffle};if(typeof module!=='undefined')module.exports=api;else root.AEPQuiz=api;
})(typeof window==='undefined'?globalThis:window);
